name: spend_track
description: "SpendTrack - A polished personal expense tracking Flutter application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.3.2
  sqflite_common_ffi: ^2.3.2
  path_provider: ^2.1.2
  path: ^1.9.0
  intl: ^0.19.0
  fl_chart: ^0.68.0
  csv: ^6.0.0
  share_plus: ^9.0.0
  shared_preferences: ^2.2.3
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
